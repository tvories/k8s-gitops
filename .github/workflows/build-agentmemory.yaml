---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build agentmemory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/agentmemory/**
      - .github/workflows/build-agentmemory.yaml

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version from Dockerfile
        id: version
        run: |
          version="$(sed -n 's/^ARG AGENTMEMORY_VERSION=//p' docker/agentmemory/Dockerfile | head -1)"
          if [ -z "$version" ]; then
            echo "could not read ARG AGENTMEMORY_VERSION from the Dockerfile" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/agentmemory
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/tvories/agentmemory:${{ steps.version.outputs.version }}
            ghcr.io/tvories/agentmemory:latest
