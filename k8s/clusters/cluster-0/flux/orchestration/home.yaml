---
# Single-purpose L4 proxy for the voice stack: desktop GPU primary, in-cluster
# CPU backup. Lives in `home` rather than `network` because it exists only for
# whisper/kokoro and would not be reused for other HAProxy needs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-haproxy-voice
  namespace: flux-system
spec:
  dependsOn:
    - name: home-namespace
    - name: home-whisper
    - name: home-kokoro
  interval: 5m
  path: "./k8s/clusters/cluster-0/manifests/home/haproxy-voice"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: k8s-gitops
