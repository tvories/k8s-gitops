---
# home-piper removed 2026-08-03. Kokoro on the desktop GPU synthesises in
# 0.12s versus Piper's 0.49s on CPU, so the fast-but-robotic fallback no
# longer earns its place. The in-cluster CPU Kokoro (3.20s) remains as the
# HAProxy backup path.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-kokoro
  namespace: flux-system
spec:
  dependsOn:
    - name: home-namespace
    - name: rook-ceph-cluster
  interval: 5m
  path: "./k8s/clusters/cluster-0/manifests/home/kokoro"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: k8s-gitops
