# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/postgresql.cnpg.io/cluster_v1.json
# postgres5 (PG15) was retired 2026-10-09 after its last apps (sonarr, radarr,
# vaultwarden, atuin) moved here. Its S3 base backups/WAL remain under
# s3://cnpg/postgres5/ until deleted by hand.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres6
  namespace: database
spec:
  instances: 3
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-1.0.0
  enableSuperuserAccess: true
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required

  storage:
    size: 75Gi
    storageClass: local-hostpath
  superuserSecret:
    name: cloudnative-pg-secret

  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
  monitoring:
    enablePodMonitor: true

  # Example of rolling update strategy:
  # - unsupervised: automated update of the primary once all
  #                 replicas have been upgraded (default)
  # - supervised: requires manual supervision to perform
  #               the switchover of the primary
  primaryUpdateStrategy: unsupervised

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    # limits:
    #   cpu: 250m
    #   memory: 640Mi

  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      wal:
        compression: gzip
        maxParallel: 12
      destinationPath: s3://cnpg/
      endpointURL: https://s3.nas.t-vo.us:443
      serverName: &currentCluster postgres6
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: aws-secret-access-key

  bootstrap:
    initdb:
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
    # recovery:
    #   source: &previous-cluster postgres4
