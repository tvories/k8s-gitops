---
apiVersion: v1
kind: Service
metadata:
  name: postgres-lb
  namespace: database
  annotations:
    io.cilium/lb-ipam-ips: 192.168.83.52
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres6
    role: primary
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database
spec:
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    # Stable aliases for the current primary: on the next cluster migration,
    # repoint both Services here instead of every app. (Apps currently target
    # postgres6-rw directly; moving them to postgres.database.svc is optional.)
    cnpg.io/cluster: postgres6
    role: primary
