---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui-secret
  namespace: downloads
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: qui-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Signs session cookies. If unset, qui generates one at startup and
        # every restart logs all users out — so it has to be stable.
        QUI__SESSION_SECRET: "{{ .QUI__SESSION_SECRET }}"
  dataFrom:
    - extract:
        key: qui
