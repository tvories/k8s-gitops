---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qui
  namespace: downloads
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: qui
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false

  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      qui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.30.0@sha256:1172ca40283330445d61189263a65a31ba703770a230b9e2a913f6e57bc2dd23
            env:
              TZ: "${TIMEZONE}"
              QUI__HOST: 0.0.0.0
              QUI__PORT: &port 7476
              # The image already sets HOME/XDG_CONFIG_HOME/XDG_DATA_HOME to
              # /config, so config.toml lands on the PVC. Pinning DATA_DIR keeps
              # qui.db beside it rather than wherever the config dir resolves to.
              QUI__DATA_DIR: /config
              QUI__LOG_LEVEL: INFO
              # DNS-rebinding guard. qui returns 400 before routing for any Host
              # not on this list; only localhost is added implicitly, which is
              # why the probes below send an explicit Host header.
              QUI__ALLOWED_HOSTS: &host "qui.${SECRET_DOMAIN}"
            envFrom:
              - secretRef:
                  name: qui-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/liveness
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: *host
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: *host
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/liveness
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: *host
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    ingress:
      app:
        enabled: true
        className: "nginx-internal"
        hosts:
          - host: *host
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: tls.qui
            hosts:
              - *host

    persistence:
      config:
        enabled: true
        existingClaim: qui-config
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
