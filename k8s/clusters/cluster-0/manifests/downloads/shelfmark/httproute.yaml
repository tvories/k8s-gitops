---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shelfmark
  namespace: downloads
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "shelfmark.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: shelfmark
          port: 8084
