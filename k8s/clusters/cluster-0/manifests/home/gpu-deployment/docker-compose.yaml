# GPU voice services for the desktop (RTX 3080).
#
# These are the *primary* backends behind the HAProxy VIP on OPNsense; the
# in-cluster CPU pods (home/whisper, home/kokoro) are the fallback. Nothing in
# this file is applied by Flux -- it lives here so the config sits beside the
# cluster-side manifests it mirrors. Run it on the desktop:
#
#     docker compose up -d
#
# Ports are deliberately the same as the in-cluster services so HAProxy can
# treat desktop and cluster as interchangeable backends:
#   10300  Wyoming ASR   (whisper)
#   10200  Wyoming TTS   (kokoro via the wyoming_openai bridge)
#
# Not behind HAProxy (no in-cluster twin):
#   8178   OpenAI-compatible ASR for BookBridge (whisper.cpp server)
#
# Requires the NVIDIA Container Toolkit.  Verify the GPU is visible first:
#     docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu24.04 nvidia-smi

services:
  # --- STT -------------------------------------------------------------------
  # linuxserver's image (not rhasspy's) because it is the one that publishes
  # CUDA builds. Note the config interface differs from the in-cluster pod:
  # env vars here, command-line args there.
  #
  # WHISPER_MODEL is large-v3 on purpose. The cluster runs base-int8 for speed
  # on CPU; the GPU can afford a far more accurate model at similar latency.
  # Transcription quality therefore *changes* on failover -- that is the
  # intended trade, not a bug.
  whisper:
    image: lscr.io/linuxserver/faster-whisper:3.8.1-gpu
    container_name: wyoming-whisper-gpu
    restart: unless-stopped
    ports:
      - "10300:10300"
    environment:
      TZ: America/Denver
      PUID: "1000"
      PGID: "1000"
      WHISPER_MODEL: large-v3
      WHISPER_BEAM: "1"
      WHISPER_LANG: en
    volumes:
      - whisper-data:/config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- Batch ASR for BookBridge ------------------------------------------------
  # BookBridge (media/bookbridge) transcribes every new full-length audiobook
  # with Whisper before CTC-aligning it to the ebook. In-cluster that is the
  # `tiny` model on 4 CPUs; this offloads it to the GPU with a far better model.
  #
  # A separate server, not the Wyoming whisper above: BookBridge speaks the
  # OpenAI HTTP API (POST /v1/audio/transcriptions, response_format=
  # verbose_json), which Wyoming does not. whisper.cpp is the server BookBridge's
  # remote provider ("whispercpp") is built around.
  #
  # No failover, unlike voice: if this desktop is off, BookBridge's job fails
  # and retries every 15 minutes (up to 5 times) until it is back. Fine for
  # background batch work; it is why this is not behind HAProxy.
  #
  # Pinned to the image built from the v1.9.5 release commit — whisper.cpp only
  # publishes commit-tagged images, so the tag is the commit SHA.
  whisper-cpp:
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda-d1be6fde11ac6e0407606b4e42fe72d34add8037
    container_name: whisper-cpp-gpu
    restart: unless-stopped
    ports:
      - "8178:8178"
    # The image's entrypoint is `bash -c`, so this is one shell string. Fetch
    # the model on first start (~1.6 GB, kept in the volume), then serve.
    # large-v3-turbo: near large-v3 accuracy at several times the speed, and a
    # small VRAM footprint beside the voice models on the 10 GB 3080.
    # --inference-path moves the endpoint to the OpenAI path BookBridge calls;
    # the default is /inference. No --convert: BookBridge sends WAV already.
    command:
      - >-
        { [ -f /models/ggml-large-v3-turbo.bin ]
        || ./models/download-ggml-model.sh large-v3-turbo /models; }
        && exec whisper-server
        --host 0.0.0.0 --port 8178
        --model /models/ggml-large-v3-turbo.bin
        --inference-path /v1/audio/transcriptions
        --language en
    environment:
      TZ: America/Denver
    volumes:
      - whisper-cpp-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- TTS -------------------------------------------------------------------
  # Kokoro speaks an OpenAI-compatible HTTP API, not Wyoming, so it is paired
  # with the same wyoming_openai bridge the cluster uses. Same versions as
  # home/kokoro so behaviour matches on failover.
  kokoro:
    # Keep this in step with home/kokoro's kokoro-fastapi-cpu tag -- the two are
    # interchangeable backends behind the same VIP, so a version skew means
    # behaviour changes on failover.
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.2
    container_name: kokoro-gpu
    restart: unless-stopped
    expose:
      - "8880"
    environment:
      TZ: America/Denver
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  kokoro-bridge:
    image: ghcr.io/roryeckel/wyoming_openai:0.8.0
    container_name: wyoming-kokoro-bridge
    restart: unless-stopped
    depends_on:
      - kokoro
    ports:
      - "10200:10200"
    environment:
      TZ: America/Denver
      WYOMING_URI: tcp://0.0.0.0:10200
      WYOMING_LOG_LEVEL: INFO
      WYOMING_LANGUAGES: en
      # Service name, not localhost -- the bridge is a separate container here,
      # unlike the cluster where both share a pod network namespace.
      TTS_OPENAI_URL: http://kokoro:8880/v1
      TTS_MODELS: kokoro
      TTS_BACKEND: KOKORO_FASTAPI
      TTS_STREAMING_MODELS: kokoro
      # MUST stay identical to home/kokoro's list. Home Assistant stores the
      # selected voice by name (currently bf_lily); a voice missing from one
      # side would break TTS the moment HAProxy fails over to it.
      TTS_VOICES: >-
        af_alloy af_aoede af_bella af_heart af_jadzia af_jessica
        af_kore af_nicole af_nova af_river af_sarah af_sky
        af_v0 af_v0bella af_v0irulan af_v0nicole af_v0sarah af_v0sky
        am_adam am_echo am_eric am_fenrir am_liam am_michael
        am_onyx am_puck am_santa
        am_v0adam am_v0gurney am_v0michael
        bf_alice bf_emma bf_isabella bf_lily bf_v0emma bf_v0isabella
        bm_daniel bm_fable bm_george bm_lewis bm_v0george bm_v0lewis
        ef_dora em_alex em_santa ff_siwis
        hf_alpha hf_beta hm_omega hm_psi
        if_sara im_nicola
        jf_alpha jf_gongitsune jf_nezumi jf_tebukuro jm_kumo
        pf_dora pm_alex pm_santa
        zf_xiaobei zf_xiaoni zf_xiaoxiao zf_xiaoyi
        zm_yunjian zm_yunxi zm_yunxia zm_yunyang

volumes:
  whisper-data:
  whisper-cpp-models:
