# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home
spec:
  releaseName: home-assistant
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: home-assistant
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        # /config was chowned to 568:568 out-of-band on 2026-08-08 (it held a
        # mix of root:root and 1000:0 from running as root). Because the root
        # dir now matches, OnRootMismatch skips the recursive chown at mount --
        # otherwise it would walk ~64k entries before the container starts.
        fsGroupChangePolicy: OnRootMismatch
      # NO multus attachment. Removed 2026-08-09 -- see the hostNetwork note
      # below. Rootless (568) is deliberately KEPT so that the next test changes
      # only one variable at a time; the two were changed together on 2026-08-09
      # and voice broke, which told us nothing about which one was responsible.
    controllers:
      home-assistant:
        pod:
          # hostNetwork. Attaching HA to multus-iot has now broken voice assist
          # TWICE (2026-08-06 with two networks, 2026-08-09 with one), and both
          # times the signature was identical: TYPING to the assistant works,
          # SPEAKING produces no response, while STT and TTS test healthy in
          # isolation. That signature is the tell -- the conversation/intent
          # path is fine and only AUDIO DELIVERY fails.
          #
          # ROOT CAUSE, CONFIRMED 2026-08-09 -- and it is not really "multus":
          #
          # HA hands voice satellites an ABSOLUTE media URL to fetch TTS audio
          # from. `internal_url` is unset (None), so HA derives one from
          # async_get_source_ip(), which is the source address it would use
          # toward MDNS_TARGET_IP 224.0.0.251. Measured inside the pod while
          # attached to multus:
          #     -> 224.0.0.251   src=10.244.4.242   (cluster pod IP)
          #     -> 192.168.1.48  src=10.244.4.242   (the Voice PE puck)
          # So HA advertised http://10.244.4.242:8123/api/tts_proxy/<hash>.flac,
          # which NO satellite on 192.168.1.0/24 can route to. Under hostNetwork
          # the same derivation yields 192.168.1.65 -- exactly what echomuse
          # logged while voice worked:
          #     Streaming TTS audio from
          #     http://192.168.1.65:8123/api/tts_proxy/<hash>.flac
          #
          # This is why typing works and speaking does not: the conversation
          # path is entirely in-cluster, while playback requires the satellite
          # to reach back INTO HA over a routable address.
          #
          # It also retires two earlier wrong theories -- "two attachments" and
          # "IoT VLAN client isolation". Neither mattered; ANY non-hostNetwork
          # configuration breaks voice while internal_url is unset.
          #
          # THE FIX that makes multus viable: set internal_url to a stable
          # reachable address (the LoadBalancer 192.168.83.37, or the ha.
          # hostname) so the URL never depends on pod networking.
          #
          # Compounding factor: the multus-iot NAD declares a redundant route
          # for 192.168.50.0/24 via 192.168.50.1, which outranks the kernel's
          # connected route and sends replies to the ROUTER's MAC instead of the
          # peer's. That breaks all INBOUND TCP to 192.168.50.10 (peers hang in
          # SYN_RECV) and forces outbound IoT traffic through that VLAN's
          # restrictive firewall. Proven by packet capture on the sibling
          # multus-legacy NAD. It also explains the older, wrong "IoT client
          # isolation" theory: the gateway answered because traffic was being
          # sent TO the gateway, while devices behind it did not.
          #
          # DO NOT retry multus here until BOTH are addressed: delete the NAD's
          # redundant route, and pin HA's internal_url/media URL to an address
          # the satellites can actually reach.
          hostNetwork: true
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.8.3
            env:
              TZ: "${TIMEZONE}"
              # Makes pre-installed custom-integration dependencies importable.
              # REQUIRED while running rootless (568). Verified 2026-08-10.
              #
              # Why: HA installs custom-integration requirements with
              # `uv pip install`. It only passes `--target` when NOT in a
              # container AND when neither UV_SYSTEM_PYTHON nor UV_PYTHON is
              # set (homeassistant/util/package.py). This image bakes in
              # UV_SYSTEM_PYTHON=true, so uv installs into
              # /usr/local/lib/python3.14/site-packages -- which uid 568 cannot
              # write. Result: "Setup failed for custom integration 'frigate':
              # Requirements for frigate not found: ['hass-web-proxy-lib==0.0.8']".
              #
              # UV_SYSTEM_PYTHON cannot be unset from Kubernetes -- overriding
              # it to "" still satisfies `var in env` -- so that lever is
              # closed. But HA SKIPS installing any requirement it can already
              # import, so pre-installing into a writable dir and putting it on
              # PYTHONPATH sidesteps the install entirely.
              #
              # DO NOT set PYTHONPATH=/config/deps. Tried 2026-08-10; it CRASHED
              # Home Assistant on startup:
              #   ImportError: cannot import name 'AddressResolver' from
              #   'zeroconf' (/config/deps/zeroconf/__init__.py)
              #
              # PYTHONPATH is inserted BEFORE site-packages in sys.path, and
              # /config/deps still holds ~45 packages from when HA ran as root
              # (zeroconf, certifi, idna, grpcio, cachetools, google, ...). Those
              # stale copies shadowed the image's current versions. Any directory
              # placed on PYTHONPATH must contain ONLY packages absent from the
              # image, or it will silently downgrade core dependencies.
              #
              # The dependency is instead pre-installed into the user
              # site-packages dir, which Python adds to sys.path automatically --
              # no PYTHONPATH required.
              #
              # The official image sets HOME=/ , so site.getusersitepackages()
              # resolves to /.local/... which does not exist and is not writable.
              # Pointing HOME at the config volume moves it to
              # /config/.local/lib/python3.14/site-packages -- writable by 568,
              # persistent, and added to sys.path by site.py at interpreter
              # startup once the directory exists. The upstream rootless image
              # (ghcr.io/home-operations/home-assistant) sets HOME=/config for
              # the same reason.
              #
              # This does NOT change where HA installs. UV_SYSTEM_PYTHON=true is
              # baked into the image, which disables HA's --target fallback
              # (homeassistant/util/package.py), and it cannot be unset from
              # Kubernetes -- overriding it to "" still satisfies `var in env`.
              # HA does, however, SKIP any requirement it can already import, so
              # pre-installing is enough.
              #
              # PROCEDURE for a custom integration with pip requirements.
              # Never install straight into user-site with deps: transitive deps
              # would land there too and shadow the image. Stage first, then
              # copy only what the image lacks.
              #
              #   S=/config/.stage
              #   U=/config/.local/lib/python3.14/site-packages
              #   I=/usr/local/lib/python3.14/site-packages
              #   rm -rf $S && mkdir -p $S
              #   HOME=/config python3 -m uv pip install --target $S \
              #     --index-strategy unsafe-first-match "<pkg>==<ver>" ...
              #   for d in $S/*; do b=$(basename $d)
              #     [ -e "$I/$b" ] || cp -r "$d" "$U"/ ; done
              #   rm -rf $S
              #
              # Then import-test, do not trust metadata alone:
              #   python3 -c "import <module>"
              # And audit every integration at once:
              #   for m in /config/custom_components/*/manifest.json ...
              #   homeassistant.util.package.is_installed(req)
              #
              # Drop any staged package that shadows a STDLIB module -- the
              # `asyncio` 3.4.3 backport gets pulled in as a transitive dep and
              # was removed by hand on 2026-08-10.
              #
              # Currently holds (all absent from the image, all import-verified):
              #   aioblescan janus            -> ble_monitor
              #   hass_web_proxy_lib          -> frigate
              #   alexapy authcaptureproxy dictor
              #                               -> alexa_media
              #   glocaltokens ghome_foyer_api gpsoauth
              #                               -> google_home
              #   weatherbitpypi              -> weatherbit
              #   markdown_it mdurl           -> transitive
              HOME: "/config"
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secret
                    key: INIT_POSTGRES_HOST
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secret
                    key: INIT_POSTGRES_DBNAME
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            resources:
              requests:
                cpu: 109m
                memory: 588M

          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.134.0@sha256:9d6c9b2e89f95c95885f859bbca0af2f648c376e61e9bbdff5c14be5a6e27d40
            env:
              # password: ${SECRET_CODESERVER_PASSWORD}
              TZ: "${TIMEZONE}"
              HASS_SERVER: http://localhost:8123
            args:
              - --auth
              - "none"
              - --user-data-dir
              - "/config/.vscode"
              - --extensions-dir
              - "/config/.vscode"
              - --port
              - "12321"
              - "/config"
            resources:
              requests:
                cpu: 11m
                memory: 94M
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      (
                        set -ex
                        apt update
                        apt install --yes dnsutils
                        apt install --yes iproute2
                        apt install --yes inetutils-ping
                        apt install --yes inetutils-telnet
                        apt install --yes inetutils-traceroute
                        apt install --yes net-tools
                      ) > /tmp/postStart.log 2>&1 || true

          matterserver:
            image:
              repository: ghcr.io/home-assistant-libs/python-matter-server
              tag: 8.1.0
            workingDir: "/matter_data"
            env:
              TZ: "${TIMEZONE}"
              MATTER_SERVER__INSTANCE_NAME: Matter-Server
              MATTER_SERVER__PORT: &matter_port 5580
              MATTER_SERVER__APPLICATION_URL: &matter_host "matter.${SECRET_DOMAIN}"
              MATTER_SERVER__LOG_LEVEL: info
            resources:
              requests:
                cpu: 20m
                memory: 100M
            securityContext:
              appArmor: "unconfirmed"
              privileged: true

        # initContainers:
        #   recorder-initdb:
        #     image:
        #       repository: ghcr.io/home-operations/postgres-init
        #       tag: 17.5.0
        #     envFrom:
        #       - secretRef:
        #           name: home-assistant-secret

    service:
      app:
        controller: home-assistant
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "${LB_HOMEASSISTANT}"
        externalTrafficPolicy: Cluster
        # loadBalancerIP: "${LB_HOMEASSISTANT}"
        ports:
          http:
            port: 8123
          mdns-tcp:
            enabled: true
            port: 5353
            protocol: TCP
            targetPort: 5353
          mdns-udp:
            enabled: true
            port: 5353
            protocol: UDP
            targetPort: 5353
      codeserver:
        # type: ClusterIP
        controller: home-assistant
        ports:
          http:
            enabled: true
            port: 12321
            # protocol: TCP
            # targetPort: 12321
      matterserver:
        controller: home-assistant
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: "192.168.83.54"
        ports:
          http:
            enabled: true
            port: *matter_port
            protocol: TCP
            targetPort: *matter_port
          mdns-tcp:
            enabled: true
            port: 5353
            protocol: TCP
            targetPort: 5353
          mdns-udp:
            enabled: true
            port: 5353
            protocol: UDP
            targetPort: 5353

    ingress:
      app:
        className: nginx-external
        annotations:
          service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: "true"
          nginx.ingress.kubernetes.io/cors-allow-headers: "X-Forwarded-For, X-Real-IP, X-Frame-Options, X-Content-Type-Options, X-Forwarded-Proto"
          nginx.org/websocket-services: home-assistant-app
        hosts:
          - host: &host "ha.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: "ha-local.${SECRET_DOMAIN}" # used for dumb iot devices that won't use local dns
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: tls.homeassistant
            hosts:
              - *host
              - ha.local.${SECRET_DOMAIN}

      codeserver:
        className: nginx-internal
        annotations:
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          cert-manager.io/cluster-issuer: letsencrypt-production
        hosts:
          - host: &vscodehost "ha-vscode.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: codeserver
                  port: http
        tls:
          - secretName: tls.ha-vscode
            hosts:
              - *vscodehost

      matterserver:
        className: nginx-internal
        hosts:
          - host: *matter_host
            paths:
              - path: /
                service:
                  identifier: matterserver
                  port: http
        tls:
          - secretName: tls.matterserver
            hosts:
              - *matter_host

    persistence:
      config:
        enabled: true
        existingClaim: homeassistant-config
        globalMounts:
          - path: /config
        # mountPath: /config

      # python-matter-server keeps the CHIP/Matter fabric in /data --
      # chip_factory.ini plus the commissioning credentials that keep devices
      # paired. Until 2026-08-09 nothing was mounted there, so /data was the
      # container's ephemeral filesystem and the ENTIRE FABRIC WAS DESTROYED ON
      # EVERY RESTART. That went unnoticed while the container ran as root
      # (writes succeeded, they were just thrown away) and is the likely reason
      # the one commissioned device sat permanently unavailable.
      #
      # Running rootless turned the silent data loss into a loud crash:
      #   CHIP:DL: Failed to create temp file /data/chip_factory.ini-XXXXXX:
      #            Permission denied
      #   Configuration Manager initialization failed
      # -> SIGSEGV (exit 139), CrashLoopBackOff.
      #
      # advancedMounts (not globalMounts) because only this container needs it;
      # config above is deliberately global. fsGroup 568 makes the volume
      # writable by the non-root user without any chown dance.
      matter-data:
        existingClaim: homeassistant-matter
        advancedMounts:
          home-assistant:
            matterserver:
              - path: /data
      # dbus:
      #   enabled: true
      #   type: hostPath
      #   hostPath: /run/dbus
      #   mountPath: /run/dbus
