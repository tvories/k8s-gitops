# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home
spec:
  releaseName: home-assistant
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: home-assistant
  install:
    remediation:
      retries: 1
  upgrade:
    remediation:
      retries: 1
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        # /config was chowned to 568:568 out-of-band on 2026-08-08 (it held a
        # mix of root:root and 1000:0 from running as root). Because the root
        # dir now matches, OnRootMismatch skips the recursive chown at mount --
        # otherwise it would walk ~64k entries before the container starts.
        fsGroupChangePolicy: OnRootMismatch
      # ONE multus attachment, IoT only.
      #
      # A previous attempt attached BOTH multus-legacy (192.168.1.10) and
      # multus-iot and broke voice assist completely -- speaking produced no
      # response while typing worked, with STT/TTS verifiably healthy in
      # isolation. Reverting to hostNetwork fixed it immediately. Every
      # reference implementation attaches exactly one network; none attach two.
      #
      # The MAC is pinned. Without it macvlan mints a fresh random MAC on every
      # restart, so the pod looks like a brand-new device to the switch, AP
      # client tables and any DHCP reservation each time. 02: is the
      # locally-administered prefix; the trailing octets encode 192.168.50.10.
      #
      # `interface` names the in-pod NIC deterministically instead of relying
      # on net1/net2 ordering.
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [{
            "name": "multus-iot",
            "namespace": "network",
            "interface": "eth1",
            "ips": ["192.168.50.10/24"],
            "mac": "02:42:c0:a8:32:0a"
          }]
    controllers:
      home-assistant:
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.8.1
            env:
              TZ: "${TIMEZONE}"
              # PYTHONPATH: "/config/deps"
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secret
                    key: INIT_POSTGRES_HOST
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: home-assistant-secret
                    key: INIT_POSTGRES_DBNAME
            envFrom:
              - secretRef:
                  name: home-assistant-secret
            resources:
              requests:
                cpu: 109m
                memory: 588M

          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.131.0@sha256:3623e6362abdec6258472882b06fdeec9d6ce2ad3fda316b3c5d7ed092b89add
            env:
              # password: ${SECRET_CODESERVER_PASSWORD}
              TZ: "${TIMEZONE}"
              HASS_SERVER: http://localhost:8123
            args:
              - --auth
              - "none"
              - --user-data-dir
              - "/config/.vscode"
              - --extensions-dir
              - "/config/.vscode"
              - --port
              - "12321"
              - "/config"
            resources:
              requests:
                cpu: 11m
                memory: 94M
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      (
                        set -ex
                        apt update
                        apt install --yes dnsutils
                        apt install --yes iproute2
                        apt install --yes inetutils-ping
                        apt install --yes inetutils-telnet
                        apt install --yes inetutils-traceroute
                        apt install --yes net-tools
                      ) > /tmp/postStart.log 2>&1 || true

          matterserver:
            image:
              repository: ghcr.io/home-assistant-libs/python-matter-server
              tag: 8.1.0
            workingDir: "/matter_data"
            env:
              TZ: "${TIMEZONE}"
              MATTER_SERVER__INSTANCE_NAME: Matter-Server
              MATTER_SERVER__PORT: &matter_port 5580
              MATTER_SERVER__APPLICATION_URL: &matter_host "matter.${SECRET_DOMAIN}"
              MATTER_SERVER__LOG_LEVEL: info
            resources:
              requests:
                cpu: 20m
                memory: 100M
            securityContext:
              appArmor: "unconfirmed"
              privileged: true

        # initContainers:
        #   recorder-initdb:
        #     image:
        #       repository: ghcr.io/home-operations/postgres-init
        #       tag: 17.5.0
        #     envFrom:
        #       - secretRef:
        #           name: home-assistant-secret

    service:
      app:
        controller: home-assistant
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "${LB_HOMEASSISTANT}"
        externalTrafficPolicy: Cluster
        # loadBalancerIP: "${LB_HOMEASSISTANT}"
        ports:
          http:
            port: 8123
          mdns-tcp:
            enabled: true
            port: 5353
            protocol: TCP
            targetPort: 5353
          mdns-udp:
            enabled: true
            port: 5353
            protocol: UDP
            targetPort: 5353
      codeserver:
        # type: ClusterIP
        controller: home-assistant
        ports:
          http:
            enabled: true
            port: 12321
            # protocol: TCP
            # targetPort: 12321
      matterserver:
        controller: home-assistant
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: "192.168.83.54"
        ports:
          http:
            enabled: true
            port: *matter_port
            protocol: TCP
            targetPort: *matter_port
          mdns-tcp:
            enabled: true
            port: 5353
            protocol: TCP
            targetPort: 5353
          mdns-udp:
            enabled: true
            port: 5353
            protocol: UDP
            targetPort: 5353

    ingress:
      app:
        className: nginx-external
        annotations:
          service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: "true"
          nginx.ingress.kubernetes.io/cors-allow-headers: "X-Forwarded-For, X-Real-IP, X-Frame-Options, X-Content-Type-Options, X-Forwarded-Proto"
          nginx.org/websocket-services: home-assistant-app
        hosts:
          - host: &host "ha.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: "ha-local.${SECRET_DOMAIN}" # used for dumb iot devices that won't use local dns
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - secretName: tls.homeassistant
            hosts:
              - *host
              - ha.local.${SECRET_DOMAIN}

      codeserver:
        className: nginx-internal
        annotations:
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          cert-manager.io/cluster-issuer: letsencrypt-production
        hosts:
          - host: &vscodehost "ha-vscode.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: codeserver
                  port: http
        tls:
          - secretName: tls.ha-vscode
            hosts:
              - *vscodehost

      matterserver:
        className: nginx-internal
        hosts:
          - host: *matter_host
            paths:
              - path: /
                service:
                  identifier: matterserver
                  port: http
        tls:
          - secretName: tls.matterserver
            hosts:
              - *matter_host

    persistence:
      config:
        enabled: true
        existingClaim: homeassistant-config
        globalMounts:
          - path: /config
        # mountPath: /config
      # dbus:
      #   enabled: true
      #   type: hostPath
      #   hostPath: /run/dbus
      #   mountPath: /run/dbus
