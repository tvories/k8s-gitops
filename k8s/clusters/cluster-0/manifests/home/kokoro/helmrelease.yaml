# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kokoro
  namespace: home
spec:
  releaseName: kokoro
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kokoro
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      # Kokoro synthesises on CPU and will happily eat several cores. Keep it
      # off whichever node is running Plex so a transcode and a voice response
      # don't contend for the same 6 cores.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: media
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: plex
    controllers:
      kokoro:
        containers:
          # Kokoro-FastAPI speaks an OpenAI-compatible HTTP API, not Wyoming.
          app:
            image:
              repository: ghcr.io/remsky/kokoro-fastapi-cpu
              tag: v0.7.1
            env:
              TZ: "${TIMEZONE}"
              USE_GPU: "false"
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 4000m
                memory: 4Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec: &kokoroProbe
                  httpGet:
                    path: /v1/test
                    port: 8880
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec: *kokoroProbe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/test
                    port: 8880
                  # First boot downloads the voice models.
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

          # Wyoming <-> OpenAI bridge. This is what Home Assistant connects to;
          # it proxies to the kokoro container over localhost.
          bridge:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: "0.5.0"
            env:
              TZ: "${TIMEZONE}"
              WYOMING_URI: tcp://0.0.0.0:10200
              WYOMING_LOG_LEVEL: INFO
              WYOMING_LANGUAGES: en
              TTS_OPENAI_URL: http://localhost:8880/v1
              TTS_MODELS: kokoro
              TTS_BACKEND: KOKORO_FASTAPI
              TTS_STREAMING_MODELS: kokoro
              # All 68 voices Kokoro ships. Everything is advertised to Home
              # Assistant as English because WYOMING_LANGUAGES is en -- the
              # non-English voices still work, their language metadata is just
              # wrong, so they all stay visible in an English pipeline.
              # Prefix key: a=American b=British e=Spanish f=French h=Hindi
              # i=Italian j=Japanese p=Portuguese z=Chinese, then f/m for voice
              # gender. v0 entries are the superseded pre-1.0 models.
              TTS_VOICES: >-
                af_alloy af_aoede af_bella af_heart af_jadzia af_jessica
                af_kore af_nicole af_nova af_river af_sarah af_sky
                af_v0 af_v0bella af_v0irulan af_v0nicole af_v0sarah af_v0sky
                am_adam am_echo am_eric am_fenrir am_liam am_michael
                am_onyx am_puck am_santa
                am_v0adam am_v0gurney am_v0michael
                bf_alice bf_emma bf_isabella bf_lily bf_v0emma bf_v0isabella
                bm_daniel bm_fable bm_george bm_lewis bm_v0george bm_v0lewis
                ef_dora em_alex em_santa ff_siwis
                hf_alpha hf_beta hm_omega hm_psi
                if_sara im_nicola
                jf_alpha jf_gongitsune jf_nezumi jf_tebukuro jm_kumo
                pf_dora pm_alex pm_santa
                zf_xiaobei zf_xiaoni zf_xiaoxiao zf_xiaoyi
                zm_yunjian zm_yunxi zm_yunxia zm_yunyang
            resources:
              requests:
                cpu: 10m
                memory: 64M
              limits:
                cpu: 500m
                memory: 512M
            probes:
              liveness:
                enabled: true
                custom: true
                spec: &bridgeProbe
                  tcpSocket:
                    port: 10200
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec: *bridgeProbe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  # Waits on the kokoro container starting alongside it.
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }

    service:
      app:
        controller: kokoro
        ports:
          wyoming:
            port: 10200
            protocol: TCP
          # Kokoro's own web UI / API, handy for auditioning voices.
          http:
            port: 8880
            protocol: TCP

    persistence:
      data:
        existingClaim: kokoro-data
        globalMounts:
          - path: /app/cache
