# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
  namespace: home
spec:
  releaseName: music-assistant
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: music-assistant
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            # Both this and Home Assistant run hostNetwork, and BOTH bind
            # UDP 5353 for mDNS/zeroconf discovery. Co-scheduling them on one
            # node means whichever starts second fails to bind, and the symptom
            # is silent: discovery simply finds nothing. Keep them apart.
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: home-assistant
              topologyKey: kubernetes.io/hostname

    controllers:
      music-assistant:
        # Recreate, not RollingUpdate: the data PVC is ReadWriteOnce, and with
        # hostNetwork two replicas would also collide on ports 8095/8097.
        strategy: Recreate
        pod:
          # Sonos discovery is SSDP/UPnP plus mDNS -- link-local multicast that
          # does not route. The pod must sit on the LAN itself, exactly like
          # Home Assistant. hostNetwork rather than macvlan on purpose: the
          # multus NADs still declare a redundant gateway route for their own
          # /24, which breaks all inbound TCP to attached pods.
          hostNetwork: true
          # Required with hostNetwork, or the pod inherits the node's resolver
          # and cannot resolve in-cluster services.
          dnsPolicy: ClusterFirstWithHostNet
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.0
            env:
              TZ: "${TIMEZONE}"
              # Smart Fades downloads PyTorch model checkpoints (Beat This!,
              # skey) at provider startup. torch.hub resolves its cache to
              # $XDG_CACHE_HOME, falling back to $HOME/.cache -- and this image
              # sets HOME=/ , so it tried to mkdir /.cache and died as uid 568:
              #   torch.hub.load_state_dict_from_url -> os.makedirs(model_dir)
              #   PermissionError: [Errno 13] Permission denied: '/.cache'
              #   -> ValueError: ('Could not load the checkpoint given the
              #      provided name', 'small0')
              # The UI reports only "Setup failed", which looks like a bad
              # model name rather than a permissions problem.
              #
              # Pointing both at the ceph PVC makes the cache writable AND
              # persistent, so the checkpoints survive restarts instead of
              # being re-downloaded. Same fix as HOME=/config on Home
              # Assistant -- any rootless image with HOME=/ hits this for
              # libraries that cache under $HOME.
              # Point at the ceph PVC (/data), never at the NFS music share
              # (/media). Caching torch checkpoints over NFS would write into
              # the music library, and is slow and lock-prone besides.
              HOME: /data
              XDG_CACHE_HOME: /data/.cache
            resources:
              requests:
                cpu: 100m
                memory: 512M
              limits:
                memory: 4Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec: &probe
                  tcpSocket:
                    port: &webPort 8095
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *webPort
                  failureThreshold: 30
                  periodSeconds: 5

          # yt-dlp needs a PO Token provider to play YouTube Music. This is the
          # server half; the client half is a yt-dlp plugin bundled with Music
          # Assistant that defaults to http://127.0.0.1:4416 -- and containers
          # in a pod share a network namespace, so a sidecar IS that default.
          # No URL to configure in MA.
          #
          # `--init` from the upstream `docker run` is unnecessary here; the
          # kubelet reaps processes per container.
          #
          # NOTE: this pod is hostNetwork, so 4416 binds on the NODE's LAN
          # address, not only loopback. It is an unauthenticated local helper --
          # do not expose it via Service or ingress. If a second consumer ever
          # needs it (e.g. a yt-dlp downloader in the media stack), promote it
          # to a standalone Deployment + ClusterIP rather than reaching across
          # nodes to whichever one MA happens to be running on.
          pot-provider:
            image:
              repository: brainicism/bgutil-ytdlp-pot-provider
              tag: 1.3.2
            env:
              TZ: "${TIMEZONE}"
            resources:
              requests:
                cpu: 10m
                memory: 64M
              limits:
                memory: 512M
            probes:
              liveness:
                enabled: true
                custom: true
                spec: &potProbe
                  tcpSocket:
                    port: 4416
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec: *potProbe

    service:
      app:
        controller: music-assistant
        ports:
          http:
            port: *webPort
          # Players (including Sonos) fetch audio from this port directly, so
          # it must stay reachable on the LAN -- hostNetwork already ensures
          # that; this entry exists so the Service reflects reality.
          stream:
            port: 8097
            protocol: TCP

    # Only for reaching the web UI by name. Players talk to the node's LAN
    # address directly, not through ingress.
    ingress:
      app:
        className: nginx-internal
        annotations:
          nginx.org/websocket-services: music-assistant-app
        hosts:
          - host: &host "music.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: tls.music-assistant

    persistence:
      # MUST be /data. music_assistant/__main__.py builds its cache_dir under
      # /data and mkdirs it at startup, so /data has to be writable by uid 568:
      #   PermissionError: [Errno 13] Permission denied: '/data/.cache'
      # Mounting this at /config instead left /data pointing at whatever else
      # was mounted there -- briefly the NFS music share, which "worked" only
      # because MA was writing its database into the music library.
      data:
        existingClaim: music-assistant-data
        globalMounts:
          - path: /data
      media:
        type: nfs
        server: ${SECRET_NAS3}
        path: /ook/Media/music
        globalMounts:
          - path: /media
