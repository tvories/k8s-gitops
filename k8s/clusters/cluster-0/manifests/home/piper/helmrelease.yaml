# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: piper
  namespace: home
spec:
  releaseName: piper
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: piper
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      piper:
        containers:
          app:
            image:
              repository: rhasspy/wyoming-piper
              tag: 2.3.1
            args:
              - --voice
              - en_US-lessac-medium
            env:
              TZ: "${TIMEZONE}"
            resources:
              requests:
                cpu: 10m
                memory: 128M
              limits:
                # ONNX inference is multi-threaded; a 1-core cap was leaving
                # most of the node on the table.
                cpu: 4000m
                memory: 1Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec: &probe
                  tcpSocket:
                    port: 10200
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  # First boot downloads the voice model.
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    service:
      app:
        controller: piper
        ports:
          wyoming:
            port: 10200
            protocol: TCP

    persistence:
      data:
        existingClaim: piper-data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
