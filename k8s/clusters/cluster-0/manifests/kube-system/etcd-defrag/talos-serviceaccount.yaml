# A Talos (not Kubernetes) ServiceAccount. Talos watches these and writes a
# Secret of the same name holding a talosconfig scoped to the requested roles.
#
# os:operator is the least role that can call EtcdDefragment and EtcdStatus
# (siderolabs/talos internal/app/machined/pkg/system/services/machined.go).
# os:admin would also allow member removal and etcd recovery.
#
# Talos only honours this if BOTH the role and this namespace are listed in
# machine.features.kubernetesTalosAPIAccess on the control-plane nodes
# (talos/talconfig.yaml, controlPlane patches). Until then the Secret is
# never created and the CronJob pods sit in ContainerCreating.
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-defrag
  namespace: kube-system
spec:
  roles:
    - os:operator
