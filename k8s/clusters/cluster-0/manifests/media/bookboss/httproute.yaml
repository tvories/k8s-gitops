---
# LAN-only for now. Kobo sync and OPDS from outside the house would need an
# nginx-external Ingress (see bookbridge's sync ingress) until the external
# Gateway API cutover.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookboss
  namespace: media
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "bookboss.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: bookboss
          port: 8080
