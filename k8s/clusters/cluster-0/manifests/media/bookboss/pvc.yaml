---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookboss-data
  namespace: media
  labels:
    triliovault.trilio.io/backup: "true"
    kasten.io/backup-volume: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # sqlite database only; book files and covers live on the NAS
      storage: 2Gi
  storageClassName: ceph-block
