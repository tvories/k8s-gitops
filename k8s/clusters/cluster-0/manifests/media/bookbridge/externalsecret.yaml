---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name bookbridge-secret
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        # Encrypts every stored password, API token, sync key and session
        # cookie (the ABS token included). Held here rather than generated into
        # the data volume so a restored backup stays readable. Losing this key
        # means re-entering every integration credential.
        BOOKBRIDGE_SECRET_KEY: "{{ .BOOKBRIDGE_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: bookbridge
