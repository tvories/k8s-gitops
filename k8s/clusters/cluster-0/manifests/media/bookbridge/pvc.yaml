---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookbridge-data
  namespace: media
  labels:
    triliovault.trilio.io/backup: "true"
    kasten.io/backup-volume: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # database + cache + downloaded alignment models (quartznet ~77MB, whisper varies)
      storage: 20Gi
  storageClassName: ceph-block
