---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.1.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookorbit
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: bookorbit
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      bookorbit:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 65539
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 65539 # media-rw
            seccompProfile: { type: RuntimeDefault }
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
              pullPolicy: IfNotPresent
            envFrom: &envFrom
              - secretRef:
                  name: bookorbit-secret
          # BookOrbit's migrations run CREATE EXTENSION for uuid-ossp, pg_trgm,
          # unaccent and vector. The first three are trusted, so the database
          # owner can create them; pgvector is not, so create it here as the
          # superuser and the app's IF NOT EXISTS becomes a no-op.
          init-extensions:
            dependsOn: init-db
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
              pullPolicy: IfNotPresent
            command:
              - /bin/sh
              - -c
              - >-
                PGPASSWORD="$INIT_POSTGRES_SUPER_PASS"
                psql -h "$INIT_POSTGRES_HOST" -U postgres -d "$INIT_POSTGRES_DBNAME"
                -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
            envFrom: *envFrom
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.6.0@sha256:bbb5da52e96dbbff1dd36f55454f9845e6cde264b4b3428a3ea783124a4ca62e
            env:
              TZ: "${TIMEZONE}"
              NODE_ENV: production
              PORT: &port 3000
              # emails, Kobo endpoints and the CORS origin
              APP_URL: "https://bookorbit.${SECRET_DOMAIN}"
              # top of the folder picker when creating a library
              LIBRARY_BROWSE_ROOT: /media
              # Inside the same mount as qbittorrent's downloads and the
              # library, so a request is hardlinked into the dock and renamed
              # into the library: the torrent keeps seeding from the same
              # bytes. Across two mounts, even of one NFS export, both fall
              # back to a copy. Its watcher is inotify-only and misses files
              # other NFS clients drop here, so feed libraries, not the dock.
              BOOK_DOCK_PATH: /media/bookorbit/book-dock
              NODE_MAX_OLD_SPACE_SIZE: "1536"
              # authentik.t-vo.us resolves to a LAN IP in-cluster (split
              # horizon), which BookOrbit refuses as an OIDC issuer without this
              OIDC_ALLOW_LOCAL_ISSUERS: "true"
              # the sidecar below; READ_ALOUD_WORKER_TOKEN comes from the secret
              READ_ALOUD_WORKER_URL: http://127.0.0.1:8787
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  # database migrations run before the server listens
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
          # Builds read-along EPUBs (EPUB 3 media overlays) from a book's EPUB
          # plus its audiobook: speech-to-text alignment, CPU only in this
          # image. A sidecar so it shares the read-aloud volume with the app,
          # which hands it job folders there. One job at a time; the first job
          # per language downloads a ~190 MB model into the same volume.
          read-aloud-worker:
            image:
              repository: ghcr.io/bookorbit/bookorbit-read-aloud-worker
              tag: 3.6.0@sha256:4ca7f141f346365af8970809f7fb3947c309082c81b5b00cee0cdec5ed6c5f96
            env:
              TZ: "${TIMEZONE}"
              # only the app, in this pod, talks to it
              READ_ALOUD_WORKER_HOST: 127.0.0.1
              READ_ALOUD_CTC_DEVICE: cpu
              # books at the same paths the app sees them
              READ_ALOUD_LIBRARY_ROOTS: /media
              READ_ALOUD_WORKER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: READ_ALOUD_WORKER_TOKEN
            probes:
              # /health needs the bearer token, so check the port instead
              liveness: &workerProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8787
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *workerProbes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 4Gi
            securityContext: *securityContext

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: bookorbit-data
        advancedMounts:
          bookorbit:
            app:
              - path: /data
      # Read-aloud job folders, temp files and the speech model cache. Its own
      # claim, not backed up: a job needs ~4x its audio in scratch space.
      read-aloud:
        existingClaim: bookorbit-read-aloud
        advancedMounts:
          bookorbit:
            app:
              - path: /data/read-aloud
            read-aloud-worker:
              - path: /data/read-aloud
      # One mount for downloads, the Book Dock and the library, at the same
      # path qbittorrent uses (/media), so requests need no path mapping and
      # hardlink end to end (see BOOK_DOCK_PATH). Unsupported upstream: the
      # README says not to put any writable path on NFS, at your own risk.
      #   /media/books               the library: Audiobookshelf's, shared
      #                              (Author/Title/ folders, "Folder as Book")
      #   /media/downloads/bookorbit qbittorrent's bookorbit category
      #   /media/bookorbit/book-dock request staging
      # Writable for read-aloud publishing, request imports and the hardlink
      # test. Keep the library's file updates (rename / write metadata) off:
      # Audiobookshelf tracks these files by path, and rewriting a file splits
      # it from the torrent's seeding copy. The library watcher misses writes
      # from other pods, so give it a scan schedule in the UI.
      media:
        type: nfs
        server: ${SECRET_NAS3}
        path: /ook/Media
        advancedMounts:
          bookorbit:
            app:
              - path: /media
            read-aloud-worker:
              - path: /media
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          bookorbit:
            app:
              - path: /tmp
