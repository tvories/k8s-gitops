---
# Calibre's built-in "Automatic adding" only watches its folder from GUI startup
# and has not been reliable here, so poll the uploads folder on a schedule and
# push books through the running content server (never touch metadata.db directly).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: calibre-auto-add
  namespace: media
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 568
            runAsGroup: 65539
            fsGroup: 65539
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: add
              image: ghcr.io/linuxserver/calibre:version-v9.16.0
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -u
                  cd /uploads
                  # -mmin +1: skip files still being copied in
                  # locate the calibre CLI tools rather than hardcoding the image layout
                  CDB=$(command -v calibredb || ls /opt/calibre/calibredb /app/calibre/calibredb 2>/dev/null | head -n1)
                  if [ -z "$CDB" ]; then echo "calibredb not found in image" >&2; exit 1; fi
                  BIN=$(dirname "$CDB")
                  echo "using calibre tools in $BIN"
                  work=$(mktemp -d)
                  # recurse: chaptarr files books under <Author>/<Book>/; only pick up ebook
                  # formats so sidecar files (cover.jpg, metadata.opf) are not imported as books
                  find . -mindepth 1 -type f -mmin +1 ! -name '.*' \
                    \( -iname '*.epub' -o -iname '*.kepub' -o -iname '*.azw' -o -iname '*.azw3' \
                       -o -iname '*.mobi' -o -iname '*.pdf' -o -iname '*.fb2' -o -iname '*.lit' \
                       -o -iname '*.cbz' -o -iname '*.cbr' -o -iname '*.djvu' \) \
                    -print0 | while IFS= read -r -d '' f; do
                    echo "adding $f"

                    # ISBN embedded in the file itself (read before the file is deleted)
                    isbn=$("$BIN/ebook-meta" "$f" 2>/dev/null \
                      | sed -n 's/^Identifiers *:.*isbn:\([0-9Xx]\{10,13\}\).*/\1/p' | head -n1)

                    # calibredb's own duplicate check is title+author only, and the metadata step
                    # below rewrites those, so also match on ISBN (which survives the rewrite)
                    if [ -n "$isbn" ] && existing=$($CDB search --with-library "$LIBRARY_URL" --username "$CALIBRE_USER" --password "$CALIBRE_PASS" \
                         --limit 1 "identifiers:isbn:$isbn" 2>/dev/null) && [ -n "$existing" ]; then
                      echo "DUPLICATE: isbn $isbn already in library as book $existing, removing $f" >&2
                      rm -f -- "$f"
                      continue
                    fi

                    out=$($CDB add --with-library "$LIBRARY_URL" --username "$CALIBRE_USER" --password "$CALIBRE_PASS" "$f" 2>&1) || {
                      echo "$out" >&2
                      echo "FAILED to add $f (left in place)" >&2
                      continue
                    }
                    echo "$out"
                    id=$(echo "$out" | sed -n 's/^Added book ids: *\([0-9]\+\).*/\1/p')
                    # calibredb exits 0 when it skips a title+author duplicate: the library already
                    # has it, so drop the file; anything else unexplained stays for the next run
                    if [ -z "$id" ]; then
                      if echo "$out" | grep -qi "already exist"; then
                        echo "DUPLICATE: title+author already in library, removing $f" >&2
                        rm -f -- "$f"
                      else
                        echo "NOT added (unknown reason), leaving $f in place" >&2
                      fi
                      continue
                    fi
                    rm -f -- "$f"

                    # Best-effort metadata: only when we have an ISBN and the fetched record has that same ISBN
                    if [ -z "$isbn" ]; then
                      echo "book $id: no ISBN in file, keeping embedded metadata"
                      continue
                    fi
                    rm -f "$work"/*
                    if "$BIN/fetch-ebook-metadata" --isbn "$isbn" -o -c "$work/cover.jpg" > "$work/meta.opf" 2>"$work/err" \
                       && grep -qi "$isbn" "$work/meta.opf"; then
                      $CDB set_metadata --with-library "$LIBRARY_URL" --username "$CALIBRE_USER" --password "$CALIBRE_PASS" "$id" "$work/meta.opf" \
                        && echo "book $id: metadata applied from isbn $isbn" \
                        || echo "book $id: set_metadata failed" >&2
                    else
                      echo "book $id: no confident match for isbn $isbn, keeping embedded metadata"
                      cat "$work/err" >&2
                    fi
                  done
                  # drop <Author>/<Book>/ folders emptied by the adds above
                  find . -mindepth 1 -type d -empty -delete
              envFrom:
                - secretRef:
                    name: calibre-content-server
              env:
                - name: LIBRARY_URL
                  value: http://calibre-webserver.media.svc.cluster.local:8081/#Calibre_Library
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 512Mi
                limits:
                  memory: 3Gi
              volumeMounts:
                - name: uploads
                  mountPath: /uploads
          volumes:
            - name: uploads
              nfs:
                server: ${SECRET_NAS3}
                path: /ook/Media/ebooks/uploads
