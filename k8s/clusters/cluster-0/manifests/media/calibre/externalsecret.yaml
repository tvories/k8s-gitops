---
# Credentials for the Calibre content server user the auto-add CronJob logs in as
# (created in Calibre: Preferences -> Sharing over the net -> User accounts).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calibre-content-server
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: calibre-content-server
    creationPolicy: Owner
  data:
    - secretKey: CALIBRE_USER
      remoteRef:
        key: calibre-content-server
        property: username
    - secretKey: CALIBRE_PASS
      remoteRef:
        key: calibre-content-server
        property: password
