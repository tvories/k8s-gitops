---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name grimmory-secret
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        # MariaDB sidecar: creates the database and user on first start
        MARIADB_ROOT_PASSWORD: "{{ .GRIMMORY_MARIADB_ROOT_PASSWORD }}"
        MARIADB_PASSWORD: &dbPass "{{ .GRIMMORY_MARIADB_PASSWORD }}"
        # app
        DATABASE_PASSWORD: *dbPass
  dataFrom:
    - extract:
        key: grimmory
