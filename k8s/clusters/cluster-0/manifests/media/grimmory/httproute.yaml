---
# LAN-only, like bookorbit: Kobo/KOReader sync and OPDS from outside the house
# would need an nginx-external Ingress until the external Gateway API cutover.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grimmory
  namespace: media
  annotations:
    # internal record via the Technitium external-dns (network/external-dns)
    external-dns/enabled: "true"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - "grimmory.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: grimmory
          port: 6060
