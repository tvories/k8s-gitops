---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-data
  namespace: media
  labels:
    triliovault.trilio.io/backup: "true"
    kasten.io/backup-volume: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # app/ (covers, thumbnails, settings), mysql/ (the MariaDB sidecar's
      # datadir) and bookdrop/; books live on the NAS
      storage: 10Gi
  storageClassName: ceph-block
