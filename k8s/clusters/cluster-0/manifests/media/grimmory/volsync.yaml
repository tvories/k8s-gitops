---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-restic
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grimmory-restic-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "{{ .REPOSITORY_TEMPLATE }}/grimmory"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: volsync-restic-template
---
# The snapshot catches the MariaDB datadir live, so a restore is
# crash-consistent: InnoDB replays its log on the next start.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: grimmory
  namespace: media
spec:
  sourcePVC: grimmory-data
  trigger:
    schedule: "15 7 * * *"
  restic:
    copyMethod: Snapshot
    pruneIntervalDays: 14
    repository: grimmory-restic-secret
    cacheCapacity: 2Gi
    volumeSnapshotClassName: csi-rbdplugin-snapclass
    storageClassName: ceph-block
    moverSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
    retain:
      daily: 14
