---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: network
data:
  config.yaml: |
    # Locally-managed tunnel: the hostname -> service routing lives here in git
    # rather than in the Cloudflare dashboard, so changing what the tunnel
    # exposes is a pull request. A dashboard-managed ("token") tunnel cannot
    # mix with a local ingress block — it is one or the other.
    #
    # The tunnel UUID. NOT a secret: it is the public CNAME target
    # (<uuid>.cfargotunnel.com), visible in DNS to anyone. `terraform output
    # tunnel_id` prints it.
    #
    # cloudflared will not infer this from credentials.json even though that
    # file contains TunnelID -- `cloudflared tunnel run --help` states it must
    # come from `tunnel:` here or from the last CLI argument.
    #
    # DUPLICATED, deliberately: the same UUID is also a field on the 1Password
    # `cloudflared` item, because ../externalsecret.yaml needs it to assemble
    # credentials.json. Duplicating a public identifier is the price of NOT
    # duplicating the secret one -- tunnel_secret exists only in 1Password.
    # If the tunnel is ever recreated, the UUID changes and BOTH must be
    # updated or the connector will fail to register.
    tunnel: 7f7a69d8-162d-420e-8f93-a40824e6007c
    credentials-file: /etc/cloudflared/creds/credentials.json

    # Served on the pod IP; used by the readiness/liveness probes.
    metrics: 0.0.0.0:2000

    ingress:
      # Straight to the ClusterIP Service. TLS terminates at Cloudflare's edge,
      # so routing back through ingress-nginx would only add a hop and a second
      # certificate to keep valid. agentmemory's own bearer check still applies
      # on :3111 — this bypasses the ingress, not the application's auth.
      #
      # tcp:// NOT http://. The consumer is the agentmemory MCP client, which
      # cannot send the CF-Access-Client-Id/Secret headers Access requires (its
      # only outbound header is `authorization: Bearer $AGENTMEMORY_SECRET` —
      # there is no env var to inject others). So the client reaches this
      # through `cloudflared access tcp`, which tunnels raw TCP over a
      # WebSocket and therefore needs a TCP origin. With http:// here, the
      # WebSocket upgrade is proxied to agentmemory's HTTP server, which does
      # not speak WebSocket, and the client fails with "bad handshake".
      #
      # Consequence: https://am.<domain> is no longer a plain HTTP endpoint, so
      # curl against it directly will not work. Test through the local
      # listener instead — that exercises the real client path anyway.
      - hostname: am.${SECRET_DOMAIN}
        service: tcp://agentmemory.selfhosted.svc.cluster.local:3111

      # cloudflared requires a catch-all as the final rule, and refuses to start
      # without one. Anything not matched above is refused rather than routed.
      - service: http_status:404
