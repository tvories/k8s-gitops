---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name cloudflared-secret
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        # cloudflared reads this as a FILE, not as env vars, so it is assembled
        # here rather than stored as one blob. Three fields on the 1Password
        # `cloudflare` item (the same item cert-manager's api-key lives on --
        # there is deliberately no separate `cloudflared` item):
        #
        #   cloudflared_tunnel_secret  secret  — `openssl rand -base64 32`
        #   tunnel_id                  public  — `terraform output tunnel_id`
        #   account_tag                public  — `terraform output account_tag`
        #
        # These label names must match the 1Password field labels EXACTLY. A
        # mismatch does not error: Go templating renders a missing key as an
        # empty string, so cloudflared would receive well-formed JSON with a
        # blank field and fail at registration instead of at sync. Verify the
        # rendered Secret, not just that the ExternalSecret went green.
        #
        # Assembling here keeps tunnel_secret inside 1Password. Emitting the
        # finished JSON from Terraform instead would round-trip the secret
        # through state, the terminal and shell history, and `op run` masks it
        # on the way out anyway.
        #
        # Field names are case-sensitive to cloudflared and must stay exactly
        # AccountTag / TunnelID / TunnelSecret.
        credentials.json: >-
          {"AccountTag":"{{ .account_tag }}",
          "TunnelID":"{{ .tunnel_id }}",
          "TunnelSecret":"{{ .cloudflared_tunnel_secret }}"}
  dataFrom:
    - extract:
        key: cloudflare
