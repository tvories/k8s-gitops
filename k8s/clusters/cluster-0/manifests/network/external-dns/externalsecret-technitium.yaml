---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name external-dns-technitium-secret
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
  data:
    # 1Password item `external-dns-technitium`, field `tsig-secret`: the base64
    # secret of the TSIG key named `external-dns` (HMAC-SHA256) defined in
    # Technitium under Settings -> TSIG.
    - secretKey: tsig-secret
      remoteRef:
        key: external-dns-technitium
        property: tsig-secret
