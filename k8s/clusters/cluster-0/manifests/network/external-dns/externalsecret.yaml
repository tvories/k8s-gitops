---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name external-dns-secret
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # A scoped API TOKEN (Zone:Read + DNS:Edit on t-vo.us), not
        # cert-manager's `api-key`, which is a Global API Key and is rejected
        # as a bearer token ("Invalid format for Authorization header").
        CF_API_TOKEN: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: cloudflare
        property: external_dns_token
