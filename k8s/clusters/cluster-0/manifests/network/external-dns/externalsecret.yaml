---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name external-dns-secret
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      data:
        # Same token cert-manager uses (1Password item `cloudflare`, field
        # `api-key`). It needs Zone:Read + DNS:Edit; if records fail to create,
        # check those scopes on the token first.
        CF_API_TOKEN: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: cloudflare
        property: api-key
