---
# Internal (split-horizon) half of external-dns. The Cloudflare instance in
# helmrelease.yaml publishes the public CNAME; this one writes the LAN answer
# into Technitium's own t-vo.us zone, so ff.t-vo.us resolves to the
# nginx-external LB address from inside the network (same pattern as ha.t-vo.us).
#
# Updates go to the cluster PRIMARY (homebox, 192.168.1.243) over RFC2136 with
# TSIG. The k8s node (tdns2) is a secondary and cannot accept updates; it picks
# the change up by zone transfer.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-technitium
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.19.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    provider:
      name: rfc2136
    env:
      # The chart maps flags to EXTERNAL_DNS_* env vars, which keeps the TSIG
      # secret out of the pod spec's args.
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-technitium-secret
            key: tsig-secret
    sources:
      - ingress
    domainFilters:
      - "${SECRET_DOMAIN}"
    extraArgs:
      # Same opt-in annotation as the Cloudflare instance. No --default-targets
      # here: the record target is the Ingress's own LB address, which is
      # exactly the internal answer we want.
      - --annotation-filter=external-dns/enabled=true
      - --rfc2136-host=192.168.1.243
      - --rfc2136-port=53
      - --rfc2136-zone=${SECRET_DOMAIN}
      - --rfc2136-tsig-keyname=external-dns
      - --rfc2136-tsig-secret-alg=hmac-sha256
      # Technitium serves record lists over AXFR, which is also TSIG-gated.
      - --rfc2136-tsig-axfr
    policy: upsert-only
    registry: txt
    txtOwnerId: cluster-0-technitium
    txtPrefix: _extdns.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
