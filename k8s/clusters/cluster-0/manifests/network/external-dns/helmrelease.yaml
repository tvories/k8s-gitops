---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.19.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-secret
            key: CF_API_TOKEN
    sources:
      - ingress
    domainFilters:
      - "${SECRET_DOMAIN}"
    extraArgs:
      # Opt-in only: external-dns ignores every Ingress that lacks this
      # annotation, so it manages exactly the apps that ask for it.
      - --annotation-filter=external-dns/enabled=true
      # Every record is a CNAME to the hostname that tracks the public IP,
      # so Ingresses don't need a per-resource target annotation.
      - --default-targets=dyn.${SECRET_DOMAIN}
    # Never delete records, even for Ingresses that disappear. A chart value:
    # the chart already emits --policy, so repeating it in extraArgs is fatal.
    policy: upsert-only
    registry: txt
    txtOwnerId: cluster-0
    txtPrefix: _extdns.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
