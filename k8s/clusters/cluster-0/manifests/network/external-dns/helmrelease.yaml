---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-secret
            key: CF_API_TOKEN
    sources:
      - ingress
    domainFilters:
      - "${SECRET_DOMAIN}"
    extraArgs:
      # Opt-in only: external-dns ignores every Ingress that lacks this
      # annotation, so it manages exactly the apps that ask for it.
      - --annotation-filter=external-dns/enabled=true
      # Public DNS only for Ingresses that are actually exposed. The Technitium
      # instance shares the annotation above, so an internal-only Ingress
      # (e.g. nextcloud on nginx-internal) gets an internal record but must
      # never reach Cloudflare.
      - --ingress-class=nginx-external
      # Every record is a CNAME to the hostname that tracks the public IP,
      # so Ingresses don't need a per-resource target annotation.
      - --default-targets=dyn.${SECRET_DOMAIN}
      # Without this, default targets only apply to resources that report no
      # address of their own, and an Ingress always reports its LB IP -- so
      # the private 192.168.83.x address was published to Cloudflare instead.
      - --force-default-targets
      # Belt and braces: never publish a private address to public DNS, even
      # if the target config above is wrong again.
      - --exclude-target-net=10.0.0.0/8
      - --exclude-target-net=172.16.0.0/12
      - --exclude-target-net=192.168.0.0/16
    # Never delete records, even for Ingresses that disappear. A chart value:
    # the chart already emits --policy, so repeating it in extraArgs is fatal.
    policy: upsert-only
    registry: txt
    txtOwnerId: cluster-0
    txtPrefix: _extdns.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
