---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-catalog-acl
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: technitium-catalog-acl-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Same admin key as technitium-exporter; setting zone options needs Zones: Modify.
        TECHNITIUM_TOKEN: "{{ .admin_api_key }}"
  dataFrom:
    - extract:
        key: technitium
