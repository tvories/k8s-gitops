---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: network
resources:
  - ./externalsecret.yaml
  - ./cronjob.yaml
configMapGenerator:
  - name: technitium-catalog-acl
    files:
      - fix-catalog-acl.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # The script is full of ${...} expansions that Flux would substitute away.
    kustomize.toolkit.fluxcd.io/substitute: disabled
