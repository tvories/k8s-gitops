---
apiVersion: v1
kind: Namespace
metadata:
  name: rook-ceph
  labels:
    goldilocks.fairwinds.com/enabled: "true"
    # Every Ceph daemon mounts hostPath (/dev, /sys, lib-modules, and the
    # log/crash dirs), which the PodSecurity "baseline" level rejects at
    # admission. "privileged" is the unrestricted level -- it grants nothing,
    # it just stops PSA from evaluating pods here; what each pod actually gets
    # is still governed by its own securityContext. Set explicitly so the
    # namespace does not depend on PSA being disabled cluster-wide.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
