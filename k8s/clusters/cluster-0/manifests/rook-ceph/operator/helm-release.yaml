---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 5m
  chart:
    spec:
      chart: rook-ceph
      version: v1.20.6
      sourceRef:
        kind: HelmRepository
        name: rook-ceph-charts
        namespace: flux-system
  values:
    crds:
      enabled: true

    # The `csi:` block was removed at the v1.19.8 -> v1.20.3 bump. Chart v1.20.0
    # moved CSI behaviour settings out of this chart (and out of the
    # rook-ceph-operator-config configmap) into the ceph-csi-operator's
    # OperatorConfig/Driver CRs, so every key it held is now silently ignored:
    #
    #   enableCSIHostNetwork: true          already the chart default
    #   kubeletDirPath: /var/lib/kubelet    already the chart default
    #   pluginTolerations: <tolerate all>   inert; no node here carries a taint
    #   enableVolumeGroupSnapshot: false    obsolete — its TODO was "enable when
    #                                       v1beta1 CRDs are available", and the
    #                                       cluster now serves v1/v1beta1/v1beta2
    #
    # Nothing needed migrating. If a CSI setting is ever required again it goes
    # on the csi.ceph.io/v1 OperatorConfig (ceph-csi-operator-config) or the
    # per-driver Driver CRs, not here. The ceph-csi-operator installs itself as
    # a bundled subchart (csi.installCsiOperator, default true).

    monitoring:
      enabled: true

    resources:
      requests:
        cpu: 109m
        memory: 204M
      limits:
        memory: 453M
