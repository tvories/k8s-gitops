---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentmemory-secret
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        # Shared bearer token. Every REST call to :3111 must present it as
        # `Authorization: Bearer <secret>`, so this is what gates the ingress.
        AGENTMEMORY_SECRET: "{{ .AGENTMEMORY_SECRET }}"
        # LLM provider, used for compression / summarisation / graph extraction.
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        # Embedding provider, used for hybrid (BM25 + vector) recall.
        # OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
  dataFrom:
    - extract:
        key: agentmemory
