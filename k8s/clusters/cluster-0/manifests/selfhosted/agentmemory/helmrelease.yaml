---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentmemory
  namespace: selfhosted
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: agentmemory
  values:
    controllers:
      agentmemory:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            # Built from ./docker/agentmemory by the "Build agentmemory"
            # workflow. Upstream publishes no image of its own.
            image:
              repository: ghcr.io/tvories/agentmemory
              tag: 0.9.29
            env:
              AGENTMEMORY_DATA_DIR: /data
              III_REST_PORT: "3111"
              # Anthropic drives compression; OpenAI is embeddings-only.
              # Without this flag an OPENAI_API_KEY would take over as the
              # LLM provider too (see upstream src/config.ts).
              OPENAI_API_KEY_FOR_LLM: "false"
              EMBEDDING_PROVIDER: openai
              OPENAI_EMBEDDING_MODEL: text-embedding-3-small
              ANTHROPIC_MODEL: claude-sonnet-5
              MAX_TOKENS: "4096"
              AGENTMEMORY_AUTO_COMPRESS: "true"
              AGENTMEMORY_INJECT_CONTEXT: "true"
              GRAPH_EXTRACTION_ENABLED: "true"
              CONSOLIDATION_ENABLED: "true"
            envFrom:
              - secretRef:
                  name: agentmemory-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /agentmemory/livez
                    port: 3111
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /agentmemory/livez
                    port: 3111
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        controller: agentmemory
        ports:
          http:
            port: 3111
          streams:
            port: 3112

    ingress:
      app:
        className: "nginx-internal"
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http

    persistence:
      data:
        existingClaim: agentmemory-data
        advancedMounts:
          agentmemory:
            app:
              - path: /data
