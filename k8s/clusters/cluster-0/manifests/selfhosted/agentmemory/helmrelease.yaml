---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentmemory
  namespace: selfhosted
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: agentmemory
  values:
    controllers:
      agentmemory:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            # Built from ./docker/agentmemory by the "Build agentmemory"
            # workflow. Upstream publishes no image of its own.
            image:
              repository: ghcr.io/tvories/agentmemory
              tag: 0.9.29
              # The tag tracks the agentmemory release, but the image content
              # also depends on our Dockerfile, so a rebuild overwrites the
              # same tag. Without Always, nodes keep serving a stale cached
              # layer after a Dockerfile-only change.
              pullPolicy: Always
            env:
              AGENTMEMORY_DATA_DIR: /data
              III_REST_PORT: "3111"
              # On-device embeddings via all-MiniLM-L6-v2 (384 dims), baked
              # into the image at build time. Nothing leaves the cluster and
              # no embedding API key is needed.
              EMBEDDING_PROVIDER: local
              ANTHROPIC_MODEL: claude-sonnet-5
              MAX_TOKENS: "4096"
              AGENTMEMORY_AUTO_COMPRESS: "true"
              AGENTMEMORY_INJECT_CONTEXT: "true"
              GRAPH_EXTRACTION_ENABLED: "true"
              CONSOLIDATION_ENABLED: "true"
            envFrom:
              - secretRef:
                  name: agentmemory-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /agentmemory/livez
                    port: 3111
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /agentmemory/livez
                    port: 3111
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            # Sized for onnxruntime holding the embedding model resident.
            # No CPU limit: embedding is short bursts of real work, and a
            # limit would only throttle them.
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 3Gi
          # The viewer binds 127.0.0.1 inside the pod. Kept that way on
          # purpose: a non-loopback bind makes agentmemory demand an inbound
          # `Authorization: Bearer` on every request, which a browser cannot
          # send, and satisfying it would mean rendering AGENTMEMORY_SECRET
          # into an Ingress annotation. This sidecar shares the pod network
          # namespace, so it can reach that loopback listener and expose it to
          # the Service. authentik forward-auth on the Ingress is what actually
          # gates access.
          viewer-proxy:
            image:
              repository: docker.io/alpine/socat
              tag: 1.8.1.3
            args:
              - TCP-LISTEN:8080,fork,reuseaddr
              - TCP:127.0.0.1:3113
            # Unlike the app container, this one never needs root: the main
            # entrypoint starts privileged only to chown /data and drop via
            # gosu, whereas socat just binds an unprivileged port.
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi

    service:
      app:
        controller: agentmemory
        ports:
          http:
            port: 3111
          streams:
            port: 3112
          viewer:
            port: 8080

    ingress:
      # REST API. Guarded by AGENTMEMORY_SECRET as a bearer token, which is
      # what the MCP client sends — no authentik in front, since an OIDC
      # redirect would break a non-browser client.
      app:
        className: "nginx-internal"
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
      # Web viewer, behind authentik forward-auth. The matching provider,
      # application and outpost live in
      # manifests/security/authentik/config/agentmemory.tf. The companion
      # /outpost.goauthentik.io route on this same host is in
      # viewer-outpost-ingress.yaml — forward_single mode requires it to be
      # served from the same origin for the sign-in redirect to complete.
      viewer:
        className: "nginx-internal"
        annotations:
          nginx.ingress.kubernetes.io/auth-url: |-
            http://ak-outpost-tvo-proxy.security.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx
          nginx.ingress.kubernetes.io/auth-signin: |-
            https://{{ .Release.Name }}-viewer.${SECRET_DOMAIN}/outpost.goauthentik.io/start?rd=$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-response-headers: |-
            Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
          nginx.ingress.kubernetes.io/auth-snippet: |
            proxy_set_header X-Forwarded-Host $http_host;
        hosts:
          - host: "{{ .Release.Name }}-viewer.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: viewer

    persistence:
      data:
        existingClaim: agentmemory-data
        advancedMounts:
          agentmemory:
            app:
              - path: /data
