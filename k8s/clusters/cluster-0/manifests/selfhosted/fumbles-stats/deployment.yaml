---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fumbles-stats
  namespace: selfhosted
  labels:
    k8s-app: fumbles-stats
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: fumbles-stats
  template:
    metadata:
      labels:
        k8s-app: fumbles-stats
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fumbles-stats
          image: ghcr.io/tvories/fumbles-stats:20261015-1732
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            # nginx writes its pid and temp files here; the root fs is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
