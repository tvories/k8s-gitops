---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Image pull secret for the private ghcr.io/tvories/fumbles-stats package.
# The token lives only in 1Password (item `ghcr-pull`, field `token`): a classic
# GitHub PAT with read:packages and nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ghcr-pull
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"tvories","password":"{{ .token }}","auth":"{{ printf "tvories:%s" .token | b64enc }}"}}}
  dataFrom:
    - extract:
        key: ghcr-pull
