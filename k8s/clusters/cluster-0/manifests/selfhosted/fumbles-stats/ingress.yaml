---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fumbles-stats
  namespace: selfhosted
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    # Opts this Ingress in to external-dns (see network/external-dns).
    external-dns/enabled: "true"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  ingressClassName: nginx-external
  rules:
    - host: "ff.${SECRET_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fumbles-stats
                port:
                  name: http
  tls:
    - hosts:
        - "ff.${SECRET_DOMAIN}"
      secretName: tls.fumbles-stats
