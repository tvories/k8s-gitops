---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ai-restic
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-ai-restic-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "{{ .REPOSITORY_TEMPLATE }}/paperless-ai"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: volsync-restic-template
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: paperless-ai
  namespace: selfhosted
spec:
  # Was "paperless-ai-data", which has never existed -- the PVC is
  # paperless-ai-config (see pvc.yaml). Every sync since this was written
  # failed with 'PersistentVolumeClaim "paperless-ai-data" not found', so
  # there is no restic history for this app yet.
  sourcePVC: paperless-ai-config
  trigger:
    schedule: "0 */12 * * *"
  restic:
    copyMethod: Snapshot
    pruneIntervalDays: 14
    repository: paperless-ai-restic-secret
    # ~426Mi of data; 2Gi cache is comfortable.
    cacheCapacity: 2Gi
    volumeSnapshotClassName: csi-rbdplugin-snapclass
    storageClassName: ceph-block
    # paperless-ai runs as root and every file on this PVC is owned 0:0.
    # A 568 mover can read the app's own files (they are 0644/0755) but not
    # the filesystem's lost+found (0700 root), which makes restic error on
    # the walk. Matching the data's owner avoids that.
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    retain:
      daily: 14
