---
# yaml-language-server: $schema=https://crd.movishell.pl/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name rdpgw-secret
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      data:
        # rdpgw maps RDPGW_<SECTION>__<KEY> onto the config tree, splitting
        # on the double underscore and camel-casing the rest. The single
        # underscores matter: RDPGW_OPEN_ID__CLIENT_ID becomes
        # OpenId.ClientId, while RDPGW_OPENID__CLIENTID would become
        # Openid.Clientid and never reach the OpenId section at all.

        # Signs and encrypts the browser session cookie. Both must be
        # exactly 32 characters, and both must be identical across replicas.
        RDPGW_SERVER__SESSION_KEY: "{{ .RDPGW_SESSION_KEY }}"
        RDPGW_SERVER__SESSION_ENCRYPTION_KEY: "{{ .RDPGW_SESSION_ENCRYPTION_KEY }}"
        # Signs the PAA token that the .rdp file carries as the gateway
        # credential. 32 characters. rdpgw refuses to start if any of these
        # is left at one of the placeholder values published in its README.
        RDPGW_SECURITY__PAA_TOKEN_SIGNING_KEY: "{{ .RDPGW_PAA_TOKEN_SIGNING_KEY }}"
        # OAuth2 client registered in authentik by
        # manifests/security/authentik/config/main.tf.
        RDPGW_OPEN_ID__CLIENT_ID: "{{ .RDPGW_CLIENT_ID }}"
        RDPGW_OPEN_ID__CLIENT_SECRET: "{{ .RDPGW_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: rdpgw
