---
# Which node names may have their kubelet *serving* certificates auto-approved.
# Kubernetes auto-approves kubelet client certs but never serving certs, so
# machine.kubelet.extraArgs.rotate-server-certificates=true in talconfig.yaml
# depends on this controller -- a node missing from this regex has its CSRs
# actively DENIED, and its serving cert silently stops rotating.
#
# Bounded to the four real nodes rather than left open-ended: this decides who
# gets a signed serving cert, so it should not quietly accept a name that does
# not exist yet. Previously read
#   ^(m720q-3|physical2|m720q-1|m720q-2)$
# which omitted m720q-4 entirely and still listed physical2, a node removed in
# early 2025. That surfaced only when rotate-server-certificates finally
# reached m720q-4 and 9 of its CSRs were denied in a row.
providerRegex: |
  ^m720q-[1-4]$

# This controller runs as a pod with dnsPolicy: ClusterFirst, so it resolves
# through CoreDNS -- NOT through the node resolver. It looks node names up as
# bare short names ("m720q-4"), and CoreDNS's upstream has no such record;
# only the FQDN m720q-4.mcbadass.local exists. So SAN-vs-DNS verification
# cannot work here regardless of the nodes' own resolver settings.
#
# (Unrelated to machine.network.disableSearchDomain in talconfig -- that only
# affects host processes on the node itself.)
bypassDnsResolution: true
