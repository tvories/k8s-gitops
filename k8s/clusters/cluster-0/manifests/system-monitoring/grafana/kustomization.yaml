---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-monitoring
resources:
  - ./pvc.yaml
  - ./secret.sops.yaml
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./volsync.yaml
configMapGenerator:
  - name: network-health-dashboard
    files:
      - network-health.json=./dashboards/network-health.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # ${datasource} / $wan are Grafana variables, not Flux ones.
    kustomize.toolkit.fluxcd.io/substitute: disabled
    grafana_folder: Networking
  labels:
    grafana_dashboard: "true"
