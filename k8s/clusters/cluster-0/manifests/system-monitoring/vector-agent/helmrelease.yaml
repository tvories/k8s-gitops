---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector-agent
  namespace: system-monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: vector
      version: 0.61.0
      sourceRef:
        kind: HelmRepository
        name: vector-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # DaemonSet reading /var/log/pods on each node (hostPath, runs as root;
    # the namespace is PSA "privileged" for exactly this kind of pod).
    role: Agent

    podAnnotations:
      configmap.reloader.stakater.com/reload: vector-agent

    service:
      enabled: false

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # The fix for the startup OOMKill loop (vectordotdev/vector#26465): since
    # 0.55 the first file scan drains the backlog fast enough that jemalloc's
    # per-thread arenas balloon (one worker thread per CPU core), not a leak.
    # Upstream's tested fix: few threads and no allocator decay delay, which
    # took a 256Mi-limited agent from OOM to ~50Mi.
    env:
      - name: VECTOR_THREADS
        value: "2"
      - name: MALLOC_CONF
        value: dirty_decay_ms:0,muzzy_decay_ms:0

    # Steady state is ~40Mi; the limit is headroom for a catch-up burst.
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 256Mi

    customConfig:
      data_dir: /vector-data-dir

      api:
        enabled: false

      sources:
        # Renamed from `kubernetes_logs` (2026-10-31) to drop checkpoints left
        # behind by the OOMKill loop.
        pod_logs:
          type: kubernetes_logs
          # Applies only to files found by the startup scan (which usually runs
          # before pod metadata has synced, so finds little); files found later
          # are read from the beginning. The remap's age filter covers that.
          read_from: end
          # Skip log files untouched for an hour (dead pods, old rotations).
          ignore_older_secs: 3600
          # Interleave reads across files rather than draining one at a time.
          oldest_first: false
          use_apiserver_cache: true
          # Don't stamp every event with the node's labels (dozens of NFD
          # feature labels), the namespace's labels or the pod's annotations;
          # the remap discards them anyway. pod_labels is kept: the remap
          # derives `app` from it.
          pod_annotation_fields:
            pod_annotations: ""
          namespace_annotation_fields:
            namespace_labels: ""
          node_annotation_fields:
            node_labels: ""

      transforms:
        # Keep only what is useful and rebuild the event, so each line is not
        # carrying the full pod metadata blob into Loki.
        kubernetes_remap:
          type: remap
          inputs:
            - pod_logs
          # Drop lines older than 15 minutes before they reach the sink. On a
          # fresh start the first rescan reads every file from the beginning;
          # Loki would reject that replay as "too far behind" anyway. Dropped
          # events still advance the checkpoints.
          drop_on_abort: true
          source: |-
            ts = timestamp(.timestamp) ??
              parse_timestamp(string(.timestamp) ?? "", format: "%+") ??
              now()
            if to_unix_timestamp(ts) < to_unix_timestamp(now()) - 900 {
              abort
            }
            app = string(.kubernetes.pod_labels."app.kubernetes.io/name") ??
              string(.kubernetes.pod_labels.app) ??
              string(.kubernetes.pod_labels."k8s-app") ??
              string(.kubernetes.container_name) ??
              "unknown"
            . = {
              "timestamp": .timestamp,
              "message": .message,
              "stream": .stream,
              "app": app,
              "namespace": .kubernetes.pod_namespace,
              "container": .kubernetes.container_name,
              "node": .kubernetes.pod_node_name,
              "pod": .kubernetes.pod_name,
            }

      sinks:
        # Loki runs on homebox (nix-config), off-cluster so Talos logs survive
        # cluster outages. Pod logs go there too to keep one store.
        loki:
          type: loki
          inputs:
            - kubernetes_remap
          endpoint: http://192.168.1.43:3100
          encoding:
            codec: json
          out_of_order_action: accept
          remove_label_fields: true
          # `pod` stays in the JSON body (query with `| json | pod=...`);
          # as a label every pod restart would start a new stream.
          # The chart runs customConfig through Helm's `tpl`, so Vector's
          # {{ field }} templates are wrapped in a Go raw string to pass through
          # literally.
          labels:
            job: kubernetes
            namespace: "{{`{{ namespace }}`}}"
            app: "{{`{{ app }}`}}"
            container: "{{`{{ container }}`}}"
            node: "{{`{{ node }}`}}"
          # Batches are per stream (label set), and there are ~150 streams, so
          # the per-batch cap is multiplied by that. 1MB each blew past the
          # memory limit during a burst.
          batch:
            max_bytes: 131072
          # Vector retries 5xx forever by default, so one batch Loki keeps
          # rejecting (e.g. a 500 for timestamps outside its schema) blocks the
          # pipeline and grows memory until OOMKill. Give up after ~5 minutes of
          # backoff instead; losing a batch beats losing all logs.
          request:
            retry_attempts: 10
